# Name-based virtual hosts for port 80 of the Apache SERVICE of XAMPP (D:\xampp). It is included from D:\xampp\apache\conf\extra\httpd-vhosts.conf
# (one Include line there). The web app is then served at the root of its own name, with no sub-path:
#     http://dev.rrdgasstaion.com/
# The name must point to this PC: add the line  127.0.0.1  dev.rrdgasstaion.com  to C:\Windows\System32\drivers\etc\hosts (as administrator), and
# restart the Apache service. To use another name change the Define below. The Smart210 can use the same name as its server address (a terminal on
# the network needs the name in its own hosts file, or the IP address of this PC).
Define GASSTATION_HOST dev.rrdgasstaion.com

# the first virtual host is the one Apache uses for every name it does not know: XAMPP's own site stays what localhost and the IP address show
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "D:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName ${GASSTATION_HOST}
    DocumentRoot "D:/Projects/GasStaion/web/public"
    <Directory "D:/Projects/GasStaion/web/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "D:/Projects/GasStaion/web/storage/logs/apache-vhost-error.log"
</VirtualHost>
