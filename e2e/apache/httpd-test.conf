# A second Apache from the same XAMPP (D:\xampp, PHP 7.4.33 as the Apache module), started by hand or by e2e\run.ps1; it does not touch the
# Apache service on port 80. It serves the web app on port 8123 (the dev database) and on port 8124 (the scratch database of the end-to-end tests).
#   D:\xampp\apache\bin\httpd.exe -f D:\Projects\GasStaion\e2e\apache\httpd-test.conf
# Stop it with Ctrl+C in that window, or by ending its httpd.exe processes. Logs and the pid file are in web\storage\logs.
Define ROOT "D:/xampp/apache"
Define PROJECT "D:/Projects/GasStaion"
ServerRoot "${ROOT}"
ServerName localhost
PidFile "${PROJECT}/web/storage/logs/apache-test.pid"
Listen 8123
Listen 8124
Timeout 600

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule php7_module "D:/xampp/php/php7apache2_4.dll"
PHPINIDir "D:/xampp/php"

TypesConfig conf/mime.types
DirectoryIndex index.php
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

ErrorLog "${PROJECT}/web/storage/logs/apache-test-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "${PROJECT}/web/storage/logs/apache-test-access.log" common

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Include "${PROJECT}/e2e/apache/gasstation.conf"
