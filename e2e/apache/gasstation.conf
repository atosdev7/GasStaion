# The web app as virtual hosts. Included by httpd-test.conf; to serve it from the Apache service as well, add
#   Include "D:/Projects/GasStaion/e2e/apache/gasstation.conf"
# at the end of D:\xampp\apache\conf\httpd.conf (and a Listen 8123 / Listen 8124 line) and restart the service.

<Directory "D:/Projects/GasStaion/web/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# the app on the dev database (.env: gasstation)
<VirtualHost *:8123>
    ServerName localhost
    DocumentRoot "D:/Projects/GasStaion/web/public"
</VirtualHost>

# the app on the scratch database of the end-to-end tests: the environment comes from web/storage/logs/apache-e2e-env.conf, which e2e\run.ps1 writes
<VirtualHost *:8124>
    ServerName localhost
    DocumentRoot "D:/Projects/GasStaion/web/public"
    SetEnv DB_DATABASE gasstation_e2e
    IncludeOptional "D:/Projects/GasStaion/web/storage/logs/apache-e2e-env.conf"
</VirtualHost>
